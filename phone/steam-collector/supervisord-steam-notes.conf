# my-steam-notes phone services — installed to /etc/supervisor/conf.d/steam-notes.conf
# Managed by supervisord in Debian proot (anchored by Termux ~/server.sh).

[program:steam-collector]
command=/root/steam-notes/venv/bin/python3 /root/steam-notes/phone/steam-collector/steam_collector.py
directory=/root/steam-notes
autostart=true
autorestart=true
startsecs=10
startretries=20
stopsignal=TERM
stdout_logfile=/root/logs/steam-collector.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true

[program:steam-dashboard]
command=/root/steam-notes/venv/bin/python3 /root/steam-notes/phone/steam-collector/dashboard_loop.py
directory=/root/steam-notes
autostart=true
autorestart=true
startsecs=10
startretries=20
stopsignal=TERM
stdout_logfile=/root/logs/steam-dashboard.log
stdout_logfile_maxbytes=5MB
stdout_logfile_backups=3
redirect_stderr=true
