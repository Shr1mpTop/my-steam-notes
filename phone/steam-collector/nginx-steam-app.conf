# steam.zhili-he.top — 矩阵终端 + 数据 API（8082）
# 部署: install-inner -> /etc/nginx/sites-enabled/steam-app
# （8081 主网关在 sites-enabled/m11p，本文件只管 8082）
server {
    listen 8082 default_server;
    listen [::]:8082 default_server;
    server_name steam.zhili-he.top;

    root /root/steam-notes/www-app;
    index index.html;

    charset utf-8;
    charset_types text/css application/javascript application/json text/plain;

    # tunnel payloads: 970KB dashboard.json -> ~150KB gzipped (json is NOT in
    # Debian's default gzip_types — without this the /app/ data fetch aborts)
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    access_log /var/log/nginx/steam-app.access.log;
    error_log  /var/log/nginx/steam-app.error.log warn;

    location = /health {
        access_log off;
        return 200 "ok\n";
    }

    # matrix data API (steam-api on :8083)
    location /api/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
    }

    # same-origin live data: steam-dashboard rewrites this every minute
    location /data/dashboard.json {
        alias /root/www-static/steam/dashboard.json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
    }

    # showcase React app (built with --base=/app/, data aliased to live file)
    location = /app/data/dashboard.json {
        alias /root/www-static/steam/dashboard.json;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
    }
    location /app/ {
        alias /root/steam-notes/www-app/app/;
        try_files $uri $uri/ /app/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
