name: Daily Steam Sync

on:
  schedule:
    - cron: '17 17 * * *'  # UTC 17:17 = SG 01:17 (end of day)
  workflow_dispatch:

concurrency:
  group: daily-steam-sync
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebase latest main
        run: git pull --rebase origin main

      - uses: astral-sh/setup-uv@v4

      - name: Install deps
        run: uv sync

      - name: Daily full sync
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: uv run scripts/sync_turso.py

      - name: Generate dashboard
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: uv run scripts/poll_status.py

      - name: Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json
          git diff --cached --quiet || git commit -m "chore: daily sync $(date -u +%Y-%m-%d)"
          git push
