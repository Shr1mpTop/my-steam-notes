name: Daily Steam Sync

on:
  schedule:
    - cron: '17 17 * * *'  # UTC 17:17 = SG 01:17 (end of day)
  workflow_dispatch:

concurrency:
  group: daily-steam-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v4

      - name: Install deps
        run: uv sync --locked

      - name: Ensure database schema
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: uv run scripts/init_turso.py

      - name: Daily full sync
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: uv run scripts/sync_turso.py

      - name: Sync enrichment data
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: uv run scripts/sync_enrichment.py

      - name: Sync game update posts
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: uv run scripts/sync_game_updates.py

      - name: Poll current status
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: uv run scripts/poll_status.py

      - name: Generate dashboard
        env:
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: uv run scripts/build_dashboard.py

      - name: Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/dashboard.json
          if ! git diff --quiet; then
            echo "::error::Unexpected unstaged tracked changes before push"
            git status --short
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No dashboard changes to commit"
            exit 0
          fi
          git commit -m "chore: daily sync $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main
